<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070a16">
<title>A-ZOOLOGY — نسخة تجريبية (الوحدة الأولى)</title>
<meta name="description" content="نسخة تجريبية مجانية: الوحدة الأولى كاملة بنفس صوت وشرح التطبيق الأصلي. باقي المقرر للمشتركين.">
<meta name="application-name" content="A-ZOOLOGY — تجريبي">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3Cfilter id='g'%3E%3CfeGaussianBlur stdDeviation='3' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23070b1a'/%3E%3Ctext x='32' y='45' font-size='44' font-weight='900' text-anchor='middle' fill='%2300f0ff' filter='url(%23g)' font-family='Arial,sans-serif'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<style>
.trial-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,215,120,.45);background:rgba(255,196,64,.12);color:#ffd982;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;margin-bottom:12px}
.trial-note{border-color:rgba(34,229,255,.35)!important;background:linear-gradient(135deg,rgba(28,15,59,.85),rgba(7,10,22,.65))!important}
#subTop{white-space:nowrap;border:1px solid rgba(255,213,130,.5);background:linear-gradient(135deg,#f5b942,#ffd98a);color:#1b1204;font-weight:900;box-shadow:0 6px 22px rgba(245,185,66,.25)}
#subTop:hover{filter:brightness(1.06)}
.locked-card{position:relative;overflow:hidden;border-color:rgba(255,196,64,.3)!important}
.locked-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 0,rgba(255,196,64,.12),transparent 55%)}
.lock-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,196,64,.14);color:#ffd982;border:1px solid rgba(255,196,64,.35);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
@media (max-width:760px){#subTop{padding:8px 10px;font-size:13px}.trial-badge{font-size:11px}}
</style>
</head>
<body>
<a class="skip-link" href="#view">انتقل إلى المحتوى</a>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-logo">
    <svg viewBox="0 0 48 48" aria-hidden="true"><text x="24" y="34" font-size="34" font-weight="900" text-anchor="middle" fill="currentColor" font-family="Arial,sans-serif">Z</text></svg>
  </div>
  <div class="splash-name">A-ZOOLOGY</div>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48"><text x="24" y="34" font-size="32" font-weight="900" text-anchor="middle" fill="currentColor" font-family="Arial,sans-serif">Z</text></svg></div>
        <div>
          <h1>A-ZOOLOGY <span class="brand-dots" aria-hidden="true"><i></i><i></i><i></i></span></h1>
          <small style="color:#ffd982;font-weight:800">نسخة تجريبية — الوحدة الأولى</small>
        </div>
      </div>
    </div>
    <div class="side-scroll" id="sideNav"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="menuBtn" aria-label="فتح القائمة">☰</button>
      <div class="searchbox">
        <input id="searchInput" type="search" placeholder="ابحث في الوحدة الأولى…" autocomplete="off">
        <span class="s-ico" id="searchIcon"></span>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn sm" id="subTop" title="اشترك لفتح كل الوحدات">✦ اشترك الآن</button>
      <button class="icon-btn" id="themeBtn" title="الوضع الليلي" aria-label="تبديل الوضع الليلي">🌙 <span>ليلي</span></button>
      <button class="icon-btn" id="settingsBtn" title="الإعدادات" aria-label="الإعدادات">⚙️ <span>إعدادات</span></button>
    </header>

    <main class="content" id="view"></main>
  </div>
</div>

<div class="player" id="player">
  <div class="player-inner">
    <button class="play-btn" id="playBtn" title="تشغيل/إيقاف">▶</button>
    <div class="info">
      <b id="playerTitle">—</b>
      <div class="bar"><i id="playerBar"></i></div>
    </div>
    <select id="speedSel" title="سرعة قراءة الوحدة">
      <option value="0.8">0.8×</option>
      <option value="1" selected>1×</option>
      <option value="1.15">1.15×</option>
      <option value="1.3">1.3×</option>
      <option value="1.5">1.5×</option>
    </select>
    <button class="icon-btn" id="closePlayer" title="إغلاق">✕</button>
  </div>
</div>

<div class="term-pop" id="termPop"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<script src="content.js"></script>
<script src="codes.js"></script>
<script>window.AZOO_TRIAL = true;</script>
<script src="app.js"></script>
</body>
</html>
